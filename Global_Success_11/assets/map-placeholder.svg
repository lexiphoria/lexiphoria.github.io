<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 4640" width="100%" height="100%">
  <defs>
    <!-- Parchment & watercolor gradients -->
    <radialGradient id="parchmentBase" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fffef9" />
      <stop offset="50%" stop-color="#f8f1e3" />
      <stop offset="85%" stop-color="#ebdcc2" />
      <stop offset="100%" stop-color="#dcbe9b" />
    </radialGradient>
    
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.6" />
    </linearGradient>

    <pattern id="dongSonPattern" width="160" height="160" patternUnits="userSpaceOnUse">
      <circle cx="80" cy="80" r="60" fill="none" stroke="#b45309" stroke-width="2" stroke-opacity="0.25" />
      <circle cx="80" cy="80" r="40" fill="none" stroke="#b45309" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6,6" />
      <circle cx="80" cy="80" r="16" fill="#b45309" fill-opacity="0.15" />
      <path d="M 80,0 L 80,160 M 0,80 L 160,80" stroke="#b45309" stroke-width="1" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Base Parchment -->
  <rect width="3840" height="4640" fill="url(#parchmentBase)" />
  <rect width="3840" height="4640" fill="url(#dongSonPattern)" />

  <!-- Outer Bronze Borders -->
  <rect x="60" y="60" width="3720" height="4520" fill="none" stroke="#b45309" stroke-width="24" stroke-opacity="0.85" rx="30" />
  <rect x="100" y="100" width="3640" height="4440" fill="none" stroke="#d97706" stroke-width="8" stroke-dasharray="24,16" stroke-opacity="0.65" rx="20" />

  <!-- Corner Bronze Ornaments -->
  <circle cx="200" cy="200" r="90" fill="none" stroke="#b45309" stroke-width="12" />
  <circle cx="3640" cy="200" r="90" fill="none" stroke="#b45309" stroke-width="12" />
  <circle cx="200" cy="4440" r="90" fill="none" stroke="#b45309" stroke-width="12" />
  <circle cx="3640" cy="4440" r="90" fill="none" stroke="#b45309" stroke-width="12" />

  <!-- Mid River Seam: Semester Strait -->
  <path d="M 0,2250 C 900,2180 1800,2380 2700,2200 C 3200,2100 3600,2300 3840,2240" fill="none" stroke="url(#riverGrad)" stroke-width="320" stroke-linecap="round" />
  <path d="M 0,2250 C 900,2180 1800,2380 2700,2200 C 3200,2100 3600,2300 3840,2240" fill="none" stroke="#0369a1" stroke-width="80" stroke-dasharray="60,40" stroke-linecap="round" />

  <!-- Part 1 Golden Trail (North/Central) -->
  <path d="M 480,560 L 1190,560 L 2080,560 L 3010,580 C 3450,580 3480,950 3380,1150 L 3380,1150 C 3300,1350 2900,1380 2400,1380 L 1230,1410 C 700,1410 800,1920 1800,1950 L 2840,1950" 
        fill="none" stroke="#eab308" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85" />
  <path d="M 480,560 L 1190,560 L 2080,560 L 3010,580 C 3450,580 3480,950 3380,1150 L 3380,1150 C 3300,1350 2900,1380 2400,1380 L 1230,1410 C 700,1410 800,1920 1800,1950 L 2840,1950" 
        fill="none" stroke="#854d0e" stroke-width="18" stroke-dasharray="30,30" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Part 2 Golden Trail (South/Mekong to Ca Mau) -->
  <path d="M 3320,2520 L 2490,2570 L 1610,2550 L 750,2560 C 400,2560 400,3200 840,3290 L 1840,3310 L 2940,3330 C 3400,3330 3450,3850 3260,3920 L 3260,3920 C 3100,4050 2600,4090 2360,4090"
        fill="none" stroke="#eab308" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85" />
  <path d="M 3320,2520 L 2490,2570 L 1610,2550 L 750,2560 C 400,2560 400,3200 840,3290 L 1840,3310 L 2940,3330 C 3400,3330 3450,3850 3260,3920 L 3260,3920 C 3100,4050 2600,4090 2360,4090"
        fill="none" stroke="#854d0e" stroke-width="18" stroke-dasharray="30,30" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Section Banners painted on parchment -->
  <g transform="translate(400, 240)">
    <rect width="1800" height="130" rx="15" fill="#fef3c7" stroke="#b45309" stroke-width="8" />
    <text x="900" y="85" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="52" font-weight="bold" fill="#78350f" letter-spacing="4">
      ✦ SEMESTER 1 — FROM THE VILLAGE GATE TO THE FUTURE ✦
    </text>
  </g>

  <g transform="translate(1640, 2390)">
    <rect width="1800" height="130" rx="15" fill="#fef3c7" stroke="#b45309" stroke-width="8" />
    <text x="900" y="85" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="52" font-weight="bold" fill="#78350f" letter-spacing="4">
      ✦ SEMESTER 2 — HERITAGE TO THE HORIZON ✦
    </text>
  </g>

  <!-- Bottom Left Water Ripple & Lotus area (Quiet space for UI) -->
  <circle cx="600" cy="4100" r="320" fill="#bae6fd" fill-opacity="0.35" stroke="#38bdf8" stroke-width="8" stroke-dasharray="40,30" />
  <circle cx="600" cy="4100" r="180" fill="#e0f2fe" fill-opacity="0.45" />
  <text x="600" y="4115" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="44" font-weight="bold" fill="#0369a1" opacity="0.65">
    🌸 ĐỒNG BẰNG SÔNG CỬU LONG 🌸
  </text>
</svg>
