<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dong Ho wave pattern for Writing Tips -->
    <pattern id="writ-wv" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#A83248"/>
      <circle cx="0" cy="0" r="24" fill="#A83248"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="15" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
      <circle cx="48" cy="0" r="24" fill="#A83248"/>
      <circle cx="48" cy="0" r="22" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
      <circle cx="48" cy="0" r="15" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
      <circle cx="48" cy="0" r="8" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
      <circle cx="24" cy="12" r="24" fill="#A83248"/>
      <circle cx="24" cy="12" r="22" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
      <circle cx="24" cy="12" r="15" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
      <circle cx="24" cy="12" r="8" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
      <circle cx="0" cy="24" r="24" fill="#A83248"/>
      <circle cx="0" cy="24" r="22" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
      <circle cx="48" cy="24" r="24" fill="#A83248"/>
      <circle cx="48" cy="24" r="22" fill="none" stroke="rgba(255,235,240,0.22)" stroke-width="1.8"/>
    </pattern>
    <radialGradient id="writ-halo" cx="22%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFF0F3" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#EAA1AF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#932236" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="writ-vg" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#28050C" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Base patterned coral-crimson background -->
  <rect width="800" height="400" fill="url(#writ-wv)"/>
  <!-- Sun halo behind character -->
  <circle cx="160" cy="200" r="150" fill="url(#writ-halo)"/>
  <circle cx="160" cy="200" r="110" fill="none" stroke="#F4E9CF" stroke-width="3" stroke-dasharray="8 6" opacity="0.45"/>

  <!-- Scroll / Quill flourish silhouette in background -->
  <g transform="translate(480, 80) scale(0.6)" opacity="0.15" fill="#FFF6E3">
    <path d="M50,20 Q120,10 180,45 Q220,70 200,120 Q180,170 120,190 Q50,210 20,160 Z"/>
  </g>

  <!-- Traditional Dong Ho cloud cluster on right -->
  <g transform="translate(680, 290) scale(0.55)" opacity="0.95">
    <circle cx="-60" cy="4" r="24" fill="#1A1A1A"/>
    <circle cx="-30" cy="-10" r="32" fill="#1A1A1A"/>
    <circle cx="10" cy="-18" r="40" fill="#1A1A1A"/>
    <circle cx="50" cy="-6" r="30" fill="#1A1A1A"/>
    <circle cx="80" cy="8" r="22" fill="#1A1A1A"/>
    <rect x="-80" y="0" width="180" height="30" rx="15" fill="#1A1A1A"/>
    <circle cx="-60" cy="4" r="21" fill="#F4E9CF"/>
    <circle cx="-30" cy="-10" r="29" fill="#F4E9CF"/>
    <circle cx="10" cy="-18" r="37" fill="#F4E9CF"/>
    <circle cx="50" cy="-6" r="27" fill="#F4E9CF"/>
    <circle cx="80" cy="8" r="19" fill="#F4E9CF"/>
    <rect x="-80" y="0" width="180" height="26" rx="13" fill="#F4E9CF"/>
    <path d="M-40,6 Q-20,-8 0,-6 Q20,-4 35,4" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Small cloud bottom left -->
  <g transform="translate(110, 340) scale(0.5)" opacity="0.85">
    <circle cx="-30" cy="-5" r="26" fill="#1A1A1A"/>
    <circle cx="5" cy="-12" r="32" fill="#1A1A1A"/>
    <circle cx="40" cy="-3" r="24" fill="#1A1A1A"/>
    <rect x="-50" y="0" width="110" height="24" rx="12" fill="#1A1A1A"/>
    <circle cx="-30" cy="-5" r="23" fill="#F4E9CF"/>
    <circle cx="5" cy="-12" r="29" fill="#F4E9CF"/>
    <circle cx="40" cy="-3" r="21" fill="#F4E9CF"/>
    <rect x="-50" y="0" width="110" height="20" rx="10" fill="#F4E9CF"/>
    <path d="M-20,4 Q-5,-4 10,-3 Q25,-2 35,4" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Decorative stylized waves at bottom -->
  <g opacity="0.7">
    <path d="M0,380 Q50,360 100,380 T200,380 T300,380 T400,380 T500,380 T600,380 T700,380 T800,380 L800,400 L0,400 Z" fill="#1B4D3E" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M0,388 Q50,372 100,388 T200,388 T300,388 T400,388 T500,388 T600,388 T700,388 T800,388 L800,400 L0,400 Z" fill="#F4E9CF" stroke="#1A1A1A" stroke-width="2"/>
  </g>

  <!-- Vignette -->
  <rect width="800" height="400" fill="url(#writ-vg)"/>
</svg>
